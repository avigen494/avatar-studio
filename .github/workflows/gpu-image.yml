# Builds the GPU worker image and pushes it to GitHub Container Registry.
# Runs on every push that touches apps/gpu, and on demand with a version tag.
#
# After the first run: GitHub → Packages → avatar-gpu → "Change visibility" to
# Public (or add registry credentials in RunPod → Settings → Container Registry
# Auth). Then use ghcr.io/<owner>/avatar-gpu:<tag> as the RunPod container image.
name: gpu-image

on:
  push:
    branches: [main]
    paths: ["apps/gpu/**", ".github/workflows/gpu-image.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (for example 0.1)"
        required: true
        default: "0.1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the CUDA base image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tag
        id: tag
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="sha-${GITHUB_SHA::7}"; fi
          echo "image=ghcr.io/$OWNER/avatar-gpu" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: apps/gpu
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
            ${{ steps.tag.outputs.image }}:latest
          build-args: |
            IMAGE_TAG=avatar-gpu:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Image: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Paste this into RunPod → Serverless → New Endpoint → Container Image." >> "$GITHUB_STEP_SUMMARY"
