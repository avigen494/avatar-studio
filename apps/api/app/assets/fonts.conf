<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Minimal fontconfig so ffmpeg's drawtext and subtitles filters work on
     Windows and Linux without a system fontconfig install. -->
<fontconfig>
  <dir>C:/Windows/Fonts</dir>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir>/System/Library/Fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <cachedir>~/.fontconfig</cachedir>
  <alias><family>sans-serif</family><prefer><family>Arial</family><family>DejaVu Sans</family><family>Segoe UI</family></prefer></alias>
  <alias><family>Arial</family><default><family>DejaVu Sans</family></default></alias>
</fontconfig>
